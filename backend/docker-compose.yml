services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - gateway/.env
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      resume:
        condition: service_started
      interview:
        condition: service_started
      roadmap:
        condition: service_started
      billing:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - services/auth/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  resume:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    ports:
      - "6002:6002"
    env_file:
      - services/resume/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  interview:
    build:
      context: .
      dockerfile: services/interview/Dockerfile
    ports:
      - "6003:6003"
    env_file:
      - services/interview/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  roadmap:
    build:
      context: .
      dockerfile: services/roadmap/Dockerfile
    ports:
      - "6004:6004"
    env_file:
      - services/roadmap/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
      - "6005:6005"
    env_file:
      - services/billing/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
