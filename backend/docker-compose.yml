services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - gateway/.env
    depends_on:
      - redis
      - auth
      - resume
      - interview
      - roadmap
      - billing
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - services/auth/.env
    depends_on:
      - redis
    restart: unless-stopped

  resume:
    build:
      context: .
      dockerfile: services/resume/Dockerfile
    ports:
      - "6002:6002"
    env_file:
      - services/resume/.env
    depends_on:
      - redis
    restart: unless-stopped

  interview:
    build:
      context: .
      dockerfile: services/interview/Dockerfile
    ports:
      - "6003:6003"
    env_file:
      - services/interview/.env
    depends_on:
      - redis
    restart: unless-stopped

  roadmap:
    build:
      context: .
      dockerfile: services/roadmap/Dockerfile
    ports:
      - "6004:6004"
    env_file:
      - services/roadmap/.env
    depends_on:
      - redis
    restart: unless-stopped

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
      - "6005:6005"
    env_file:
      - services/billing/.env
    depends_on:
      - redis
    restart: unless-stopped
